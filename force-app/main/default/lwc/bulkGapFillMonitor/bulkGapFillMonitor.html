<template>
  <template lwc:if={job}>
    <div class="slds-var-m-bottom_medium">
      <lightning-badge
        label={job.Status__c}
        class="slds-var-m-right_x-small"
      ></lightning-badge>
      <lightning-badge label={isDryRunLabel}></lightning-badge>
    </div>

    <lightning-progress-bar
      value={progressValue}
      size="large"
      variant={statusVariant}
    ></lightning-progress-bar>
    <p class="slds-text-body_small slds-var-m-vertical_small">
      {progressLabel}
    </p>

    <div class="slds-grid slds-wrap slds-var-m-vertical_medium">
      <div
        class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-p-around_x-small"
      >
        <p class="slds-text-title">Gaps Found</p>
        <p class="slds-text-heading_medium">{job.GapsFound__c}</p>
      </div>
      <div
        class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-p-around_x-small"
      >
        <p class="slds-text-title">Records Created</p>
        <p class="slds-text-heading_medium">{job.RecordsCreated__c}</p>
      </div>
      <div
        class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-p-around_x-small"
      >
        <p class="slds-text-title">Records Associated</p>
        <p class="slds-text-heading_medium">{job.RecordsAssociated__c}</p>
      </div>
      <div
        class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-p-around_x-small"
      >
        <p class="slds-text-title">Errors</p>
        <p class="slds-text-heading_medium">{job.ErrorCount__c}</p>
      </div>
    </div>

    <template lwc:if={hasErrors}>
      <div class="slds-box slds-theme_warning slds-var-m-bottom_medium">
        Some footprints could not be processed. Review the results for per-asset
        detail.
      </div>
    </template>

    <template lwc:if={isRunning}>
      <lightning-button
        label="Abort Run"
        variant="destructive-text"
        onclick={handleAbort}
        disabled={isAborting}
        class="slds-var-m-right_x-small"
      ></lightning-button>
    </template>
    <lightning-button
      label="View Results"
      variant="brand"
      onclick={handleViewResults}
      class="slds-var-m-right_x-small"
    ></lightning-button>
    <lightning-button
      label="New Run"
      onclick={handleStartOver}
    ></lightning-button>
  </template>

  <template lwc:else>
    <lightning-spinner
      alternative-text="Loading run status"
      size="small"
    ></lightning-spinner>
  </template>
</template>
